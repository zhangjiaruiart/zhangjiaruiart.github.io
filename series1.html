<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERIES 1 | ZHANG JIARUI</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            font-family: "Optima", "Didot", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff; color: #111111;
        }
        nav {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; box-sizing: border-box; z-index: 1000;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .logo { font-size: 18px; font-weight: 300; letter-spacing: 0.5em; text-decoration: none; color: #111; text-transform: uppercase; }
        .nav-links a { margin-left: 35px; text-decoration: none; color: #111; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 300; }
        
        .content-section { padding: 120px 5% 40px; max-width: 1400px; margin: 0 auto; }
        .detail-header { margin-bottom: 60px; border-bottom: 1px solid #f0f0f0; padding-bottom: 20px; }
        .series-title { font-size: 24px; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; }
        .series-desc { font-size: 12px; color: #888; margin-top: 10px; letter-spacing: 0.05em; line-height: 1.8; max-width: 800px; }

        /* 图片列表：大图展示细节 */
        .image-list { display: flex; flex-direction: column; gap: 40px; }
        .image-item img { width: 100%; height: auto; display: block; }
        .image-caption { font-size: 10px; color: #aaa; margin-top: 10px; text-transform: uppercase; letter-spacing: 0.1em; }

        .back-link { display: inline-block; margin-top: 60px; font-size: 10px; color: #111; text-decoration: none; border-bottom: 1px solid #111; padding-bottom: 2px; text-transform: uppercase; letter-spacing: 0.2em; }
        
        footer { padding: 60px 5%; text-align: center; font-size: 9px; letter-spacing: 0.4em; color: #ccc; text-transform: uppercase; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ZHANGJIARUI ARTWORKS</a>
        <div class="nav-links">
            <a href="index.html">Back to Home</a>
        </div>
    </nav>

    <div class="content-section">
        <div class="detail-header">
            <h1 class="series-title">Series 1: Project Name</h1>
            <p class="series-desc">
                这里可以填写该系列的创作理念。Material: Bronze, Glass / Year: 2024. <br>
                Description: Deep exploration of ecological structures and sculptural forms.
            </p>
        </div>

        <div class="image-list">
            <div class="image-item">
                <img src="images/Series1_Detail1.jpg" alt="Detail 1" onerror="this.src='images/Work2.jpg'">
                <div class="image-caption">Overall View</div>
            </div>
            <div class="image-item">
                <img src="images/Series1_Detail2.jpg" alt="Detail 2" onerror="this.src='images/Work2.jpg'">
                <div class="image-caption">Material Detail</div>
            </div>
            <div class="image-item">
                <img src="images/Series1_Detail3.jpg" alt="Detail 3" onerror="this.src='images/Work2.jpg'">
                <div class="image-caption">Perspective View</div>
            </div>
        </div>

        <a href="index.html#sculpture" class="back-link">Back to Gallery</a>
    </div>

    <footer>
        &copy; 2026 ZHANGJIARUI ARTWORKS.
    </footer>

</body>
</html>

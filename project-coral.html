<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral Planting Project | ZHANG JIARUI</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            font-family: "Optima", "Didot", "Helvetica Neue", Helvetica, Arial, sans-serif; 
            background-color: #ffffff; color: #111111; 
        }
        
        /* 简洁导航栏 */
        nav { 
            padding: 30px 5%; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #f9f9f9;
        }
        .logo { 
            font-size: 14px; font-weight: 300; letter-spacing: 0.5em; 
            text-decoration: none; color: #111; text-transform: uppercase; 
        }
        .back-link { 
            font-size: 10px; letter-spacing: 0.2em; text-decoration: none; 
            color: #888; text-transform: uppercase; transition: color 0.3s;
        }
        .back-link:hover { color: #111; }

        /* 内容区域 */
        .container { 
            max-width: 1200px; margin: 60px auto; padding: 0 5%; 
            animation: fadeInUp 1.2s cubic-bezier(0.15, 1, 0.3, 1) both;
        }
        
        /* 视频容器 (16:9) */
        .video-wrapper { 
            position: relative; padding-bottom: 56.25%; height: 0; 
            background: #000; margin-bottom: 40px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .video-wrapper iframe { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
        }

        /* 文字信息 */
        .project-title { 
            font-size: 20px; font-weight: 300; letter-spacing: 0.1em; 
            margin-bottom: 15px; text-transform: uppercase; 
        }
        .project-meta { 
            font-size: 12px; color: #aaa; letter-spacing: 0.05em; 
            line-height: 1.8; text-transform: uppercase;
        }

        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @media (max-width: 768px) {
            .container { margin: 30px auto; }
            .project-title { font-size: 18px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">ZHANGJIARUI</a>
        <a href="index.html" class="back-link">← BACK TO WORKS</a>
    </nav>

    <div class="container">
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/OEZ3FvOwdjI?rel=0&autoplay=1" allowfullscreen></iframe>
        </div>
        
        <div class="info-section">
            <h1 class="project-title">Coral Planting Project</h1>
            <p class="project-meta">
                Documentary / 2025 / Xisha Islands
            </p>
        </div>
    </div>

    <footer style="padding: 80px 5% 40px; text-align: center; font-size: 9px; letter-spacing: 0.4em; color: #ccc; text-transform: uppercase;">
        &copy; 2026 ZHANGJIARUI ARTWORKS.
    </footer>
</body>
</html>

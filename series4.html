<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMLESS SERIES | ZHANG JIARUI</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            font-family: "Optima", "Didot", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff; color: #111111;
            scroll-behavior: smooth;
        }

        /* --- 导航 --- */
        .back-nav {
            position: fixed; top: 40px; left: 5%;
            z-index: 1000;
        }
        .back-link {
            text-decoration: none; color: #111; font-size: 10px;
            letter-spacing: 0.2em; text-transform: uppercase;
            padding-bottom: 5px; border-bottom: 1px solid #eee;
            transition: all 0.4s;
        }
        .back-link:hover { border-bottom: 1px solid #111; opacity: 0.6; }

        /* --- 动画 --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 标题与阐述 --- */
        .project-header {
            padding: 160px 5% 80px;
            max-width: 800px; margin: 0 auto;
            text-align: center;
            animation: fadeInUp 1.2s cubic-bezier(0.15, 1, 0.3, 1) both;
        }

        .series-title {
            font-size: 11px; letter-spacing: 0.4em; color: #aaa;
            text-transform: uppercase; margin-bottom: 15px;
        }

        .work-title {
            font-size: 24px; font-weight: 300; letter-spacing: 0.15em;
            text-transform: uppercase; margin-bottom: 25px;
        }

        .work-meta {
            font-size: 11px; color: #888; letter-spacing: 0.1em;
            line-height: 1.8; margin-bottom: 40px;
        }

        /* --- 图片展示区域 --- */
        .details-container {
            padding: 0 5% 100px;
            max-width: 1260px; /* 保持与主页缩小的比例一致 */
            margin: 0 auto;
        }

        .detail-item {
            width: 100%; margin-bottom: 60px;
            animation: fadeInUp 1.5s cubic-bezier(0.15, 1, 0.3, 1) both;
        }

        .detail-item img {
            width: 100%; height: auto; display: block;
            background-color: #fcfcfc;
        }

        footer {
            padding: 80px 5% 40px; text-align: center;
            font-size: 9px; letter-spacing: 0.4em; color: #ccc;
            text-transform: uppercase; border-top: 1px solid #f9f9f9;
        }

        @media (max-width: 768px) {
            .project-header { padding-top: 120px; }
            .work-title { font-size: 18px; }
        }
    </style>
</head>
<body>

    <nav class="back-nav">
        <a href="index.html#sculpture" class="back-link">← Back</a>
    </nav>

    <header class="project-header">
        <div class="series-title">Sculpture</div>
        <h1 class="work-title">Formless Series</h1>
        <div class="work-meta">
            Transparent resin / 2024
        </div>
    </header>

    <main class="details-container">
        <div class="detail-item">
            <img src="images/sculpture/s4_1.jpg" alt="Formless Series 1" onerror="this.src='images/Work2.jpg'">
        </div>

        <div class="detail-item">
            <img src="images/sculpture/s4_2.jpg" alt="Formless Series 2" onerror="this.src='images/Work2.jpg'">
        </div>

        <div class="detail-item">
            <img src="images/sculpture/s4_3.jpg" alt="Formless Series 3" onerror="this.src='images/Work2.jpg'">
        </div>

        <div class="detail-item">
            <img src="images/sculpture/s4_4.jpg" alt="Formless Series 4" onerror="this.src='images/Work2.jpg'">
        </div>

        <div class="detail-item">
            <img src="images/sculpture/s4_5.jpg" alt="Formless Series 5" onerror="this.src='images/Work2.jpg'">
        </div>

        <div class="detail-item">
            <img src="images/sculpture/s4_6.jpg" alt="Formless Series 6" onerror="this.src='images/Work2.jpg'">
        </div>

        <div class="detail-item">
            <img src="images/sculpture/s4_7.jpg" alt="Formless Series 7" onerror="this.src='images/Work2.jpg'">
        </div>

        <div class="detail-item">
            <img src="images/sculpture/s4_8.jpg" alt="Formless Series 8" onerror="this.src='images/Work2.jpg'">
        </div>

        <div class="detail-item">
            <img src="images/sculpture/s4_9.jpg" alt="Formless Series 9" onerror="this.src='images/Work2.jpg'">
        </div>
    </main>

    <footer>
        &copy; 2026 ZHANGJIARUI ARTWORKS.
    </footer>

</body>
</html>

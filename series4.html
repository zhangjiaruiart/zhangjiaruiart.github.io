<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMLESS SERIES | ZHANG JIARUI</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            font-family: "Optima", "Didot", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff; color: #111;
            -webkit-font-smoothing: antialiased;
        }

        /* 导航与容器 */
        nav { padding: 40px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 14px; letter-spacing: 0.5em; text-decoration: none; color: #111; text-transform: uppercase; font-weight: 300; }
        .back-link { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; color: #aaa; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 5% 100px; }

        /* 顶部介绍 */
        .series-intro { margin: 40px 0 80px 0; max-width: 800px; }
        .series-title { font-size: 26px; font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 30px; }
        .series-description { font-size: 15px; color: #444; line-height: 2; font-weight: 300; text-align: justify; }

        /* --- 核心布局：主图与细节 --- */
        .featured-section {
            display: flex; gap: 50px; margin-bottom: 120px; align-items: flex-start;
        }
        .main-work { flex: 2; }
        .detail-gallery { 
            flex: 1; display: flex; flex-direction: column; gap: 30px; 
        }

        /* --- 视觉优化：图像清洗器 --- */
        .image-cleaner {
            width: 100%;
            background-color: #fff;
            overflow: hidden;
            /* 关键滤镜：提升对比度压制背景噪点，微调亮度让背景更纯净 */
            filter: contrast(1.1) brightness(1.02);
            mix-blend-mode: multiply; /* 让图片中的纯白与网页背景融合 */
            transition: all 0.8s ease;
        }
        
        .image-cleaner img {
            width: 100%; height: auto; display: block;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            /* 针对透明材质，稍微锐化 */
        }

        /* 悬停效果 */
        .work-item:hover .image-cleaner img { transform: scale(1.05); }
        .work-item:hover .image-cleaner { filter: contrast(1.15) brightness(1.05); }

        /* 文字信息样式 */
        .work-info { margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        .work-name { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
        .work-detail { font-size: 10px; color: #999; margin-top: 4px; }

        /* 动画 */
        .work-item { opacity: 0; transform: translateY(20px); transition: all 1s ease; }
        .work-item.visible { opacity: 1; transform: translateY(0); }

        @media (max-width: 900px) {
            .featured-section { flex-direction: column; }
            .detail-gallery { flex-direction: row; gap: 15px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ZHANGJIARUI ARTWORKS</a>
        <a href="index.html#sculpture" class="back-link">← Back to Series</a>
    </nav>

    <div class="container">
        <header class="series-intro">
            <h1 class="series-title">Formless Series</h1>
            <p class="series-description">
                Exploring the fluidity of transparent resin, this series captures the moment of transition between solid and liquid states...
            </p>
        </header>

        <section class="featured-section">
            <div class="work-item main-work">
                <div class="image-cleaner">
                    <img src="images/sculpture/s4_1.jpg" alt="At Ease I">
                </div>
                <div class="work-info">
                    <div class="work-name">At Ease I</div>
                    <div class="work-detail">Transparent Resin / 2024</div>
                </div>
            </div>

            <div class="detail-gallery">
                <div class="work-item">
                    <div class="image-cleaner">
                        <img src="images/sculpture/s4_2.jpg" alt="Detail II">
                    </div>
                    <div class="work-info">
                        <div class="work-name">At Ease II (Detail)</div>
                    </div>
                </div>
                <div class="work-item">
                    <div class="image-cleaner">
                        <img src="images/sculpture/s4_3.jpg" alt="Detail III">
                    </div>
                    <div class="work-info">
                        <div class="work-name">At Ease III (Detail)</div>
                    </div>
                </div>
                <div class="work-item">
                    <div class="image-cleaner">
                        <img src="images/sculpture/s4_4.jpg" alt="Detail IV">
                    </div>
                    <div class="work-info">
                        <div class="work-name">At Ease IV (Detail)</div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.work-item').forEach(item => observer.observe(item));
    </script>
</body>
</html>

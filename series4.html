<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMLESS SERIES | ZHANG JIARUI</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            font-family: "Optima", "Didot", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff; color: #111111;
            scroll-behavior: smooth;
        }

        /* --- 1. 返回导航 --- */
        .back-nav {
            position: fixed; top: 40px; left: 5%;
            z-index: 1000;
        }
        .back-link {
            text-decoration: none; color: #111; font-size: 10px;
            letter-spacing: 0.2em; text-transform: uppercase;
            padding-bottom: 5px; border-bottom: 1px solid #eee;
            transition: all 0.4s;
        }
        .back-link:hover { border-bottom: 1px solid #111; opacity: 0.6; }

        /* --- 2. 核心动画 --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 3. 作品描述区块 --- */
        .project-header {
            padding: 160px 5% 80px;
            max-width: 800px; margin: 0 auto;
            text-align: center;
            animation: fadeInUp 1.2s cubic-bezier(0.15, 1, 0.3, 1) both;
        }

        .series-title {
            font-size: 11px; letter-spacing: 0.4em; color: #aaa;
            text-transform: uppercase; margin-bottom: 15px;
        }

        .work-title {
            font-size: 24px; font-weight: 300; letter-spacing: 0.15em;
            text-transform: uppercase; margin-bottom: 25px;
        }

        .work-meta {
            font-size: 11px; color: #888; letter-spacing: 0.1em;
            line-height: 1.8; margin-bottom: 40px;
        }

        .work-statement {
            font-size: 13px; line-height: 2; color: #444;
            max-width: 600px; margin: 0 auto;
            text-align: justify; letter-spacing: 0.05em;
        }

        /* --- 4. 详情图像区块 --- */
        .details-container {
            padding: 0 5% 100px;
            max-width: 1260px; /* 与主页缩小的比例保持一致 */
            margin: 0 auto;
        }

        .detail-item {
            width: 100%; margin-bottom: 60px;
            animation: fadeInUp 1.5s cubic-bezier(0.15, 1, 0.3, 1) both;
        }

        .detail-item img {
            width: 100%; height: auto; display: block;
            background-color: #f9f9f9;
        }

        footer {
            padding: 80px 5% 40px; text-align: center;
            font-size: 9px; letter-spacing: 0.4em; color: #ccc;
            text-transform: uppercase; border-top: 1px solid #f9f9f9;
        }

        @media (max-width: 768px) {
            .project-header { padding-top: 120px; }
            .work-title { font-size: 18px; }
            .work-statement { font-size: 12px; }
        }
    </style>
</head>
<body>

    <nav class="back-nav">
        <a href="index.html#sculpture" class="back-link">← Back</a>
    </nav>

    <header class="project-header">
        <div class="series-title">Formless Series</div>
        <h1 class="work-title">At Ease</h1>
        <div class="work-meta">
            Transparent Resin / 2024<br>
            Dimensions variable
        </div>
        <p class="work-statement">
            "At Ease" 探讨了物质从固态到液态视觉转化的瞬间。树脂的透明度与无规律的形态交织，创造出一种游离于重力之外的轻盈感。艺术家试图捕获捕捉那些“不可定义”的形状，让观众在静止的作品中感受到流动的永恒。
        </p>
    </header>

    <main class="details-container">
        <div class="detail-item">
            <img src="images/sculpture/s4_detail1.jpg" alt="At Ease Detail 1" onerror="this.src='images/Work2.jpg'">
        </div>

        <div class="detail-item">
            <img src="images/sculpture/s4_detail2.jpg" alt="At Ease Detail 2" onerror="this.src='images/Work2.jpg'">
        </div>

        <div class="detail-item">
            <img src="images/sculpture/s4_cover.jpg" alt="At Ease Cover" onerror="this.src='images/Work2.jpg'">
        </div>
    </main>

    <footer>
        &copy; 2026 ZHANGJIARUI ARTWORKS.
    </footer>

</body>
</html>

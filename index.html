        /* 1. 基础美学设定 */
        body, html {
            margin: 0;
            padding: 0;
            font-family: "Optima", "Didot", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #111;
            scroll-behavior: smooth;

        nav {

            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 5%;
            box-sizing: border-box;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-decoration: none;
            color: #fff; 
            text-transform: uppercase;

            color: #fff;
            font-size: 12px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 300;
            transition: opacity 0.3s;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        .hero {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .hero img {

            height: 100%;

            font-weight: 300;

        }

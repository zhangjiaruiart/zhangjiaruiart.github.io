<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHANG JIARUI | ARTIST</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            font-family: "Optima", "Didot", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff; color: #111111;
            scroll-behavior: smooth;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #scroll-progress {
            position: fixed; top: 0; left: 0; width: 0%; height: 2px;
            background: #111; z-index: 3000; transition: width 0.1s ease-out;
        }

        nav {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 30px 5%; box-sizing: border-box; z-index: 2000;
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .nav-scrolled {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 15px 5%; border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo {
            font-size: 18px; font-weight: 300; letter-spacing: 0.5em;
            text-decoration: none; color: #ffffff; text-transform: uppercase;
            transition: color 0.4s ease; position: relative; z-index: 2001;
        }

        .nav-scrolled .logo { color: #111111; }
        .nav-links { display: flex; align-items: center; }
        .nav-links a {
            margin-left: 35px; text-decoration: none; color: #ffffff;
            font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
            font-weight: 300; position: relative; padding-bottom: 5px;
            transition: color 0.4s ease;
        }
        .nav-scrolled .nav-links a { color: #111111; }

        .menu-toggle { display: none; flex-direction: column; gap: 6px; cursor: pointer; z-index: 2001; }
        .menu-toggle span { width: 25px; height: 1px; background-color: #ffffff; transition: all 0.3s ease; }
        .nav-scrolled .menu-toggle span { background-color: #111; }

        /* --- COVER 优化部分 --- */
        .hero {
            height: 100vh; width: 100%; overflow: hidden;
            position: relative; background-color: #000;
        }
        #hero-img-wrap {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .hero img {
            width: 100%; height: 100%; object-fit: cover;
            object-position: center center;
            filter: brightness(0.8); display: block;
            animation: kenBurns 15s ease-in-out infinite alternate;
        }
        @keyframes kenBurns {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        .hero-overlay {
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; width: 90%; z-index: 5; pointer-events: none;
        }
        .hero-title {
            color: #ffffff; font-size: 18px; font-weight: 300;
            letter-spacing: 0.6em; text-transform: uppercase;
            margin: 0; opacity: 0; line-height: 1.6;
            animation: fadeInText 3s ease-out 1.2s forwards;
        }
        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 0.8; transform: translateY(0); }
        }

        /* --- 其他布局保持不变 --- */
        .scroll-indicator {
            position: absolute; bottom: 35px; left: 50%;
            transform: translateX(-50%); z-index: 10;
        }
        .scroll-arrow {
            width: 16px; height: 16px; border-right: 1.5px solid #ffffff; border-bottom: 1.5px solid #ffffff;
            transform: rotate(45deg); animation: arrowBounce 2s infinite;
        }
        @keyframes arrowBounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) rotate(45deg); opacity: 0.3; }
            40% { transform: translateY(-10px) rotate(45deg); opacity: 0.8; }
        }

        .content-section { padding: 80px 5% 20px; max-width: 1260px; margin: 0 auto; }
        .category-title { font-size: 13px; letter-spacing: 0.5em; text-transform: uppercase; margin-bottom: 40px; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px; color: #111; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 60px; margin-bottom: 60px; }
        .grid-sculpture-custom { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px 30px; margin-bottom: 60px; }
        .series-label { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #888; margin-bottom: 20px; }
        .project { text-decoration: none; color: inherit; display: block; }
        .project-image-wrapper { overflow: hidden; margin-bottom: 20px; background-color: #fcfcfc; position: relative; }
        .img-ratio { aspect-ratio: 4 / 5; }
        .video-ratio { aspect-ratio: 16 / 9; background-color: #000; }
        .project img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.8s cubic-bezier(0.15, 1, 0.3, 1); }
        .project:hover img { transform: scale(1.05); }

        .contact-section { padding: 80px 5% 40px; background-color: #fff; }
        .contact-container { max-width: 1100px; margin: 0 auto; text-align: center; }
        .contact-row { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
        .contact-label { font-size: 9px; color: #bbb; text-transform: uppercase; display: block; margin-bottom: 5px; letter-spacing: 0.2em; }
        .contact-value { font-size: 13px; color: #111; text-decoration: none; }
        .divider { color: #eee; align-self: center; }
        footer { padding: 60px 5% 40px; text-align: center; border-top: 1px solid #f9f9f9; font-size: 9px; letter-spacing: 0.4em; color: #ccc; text-transform: uppercase; }

        @media (max-width: 900px) {
            .hero-title { font-size: 14.4px; line-height: 2.2; letter-spacing: 0.4em; }
            .hero-title br { display: block; }
            .menu-toggle { display: flex; }
            .nav-links {
                position: fixed; top: 0; right: -100%; width: 100%; height: 100vh;
                background: #ffffff; flex-direction: column; justify-content: center;
                align-items: center; transition: 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            }
            .nav-links.active { right: 0; }
            .nav-links a { color: #111111 !important; margin: 20px 0; font-size: 14px; }
            .grid, .grid-sculpture-custom { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="scroll-progress"></div>

    <nav id="navbar">
        <a href="index.html" class="logo">ZHANGJIARUI ARTWORKS</a>
        <div class="nav-links" id="navLinks">
            <a href="#eco-art" onclick="closeMenu()">Ecological Art</a>
            <a href="#sculpture" onclick="closeMenu()">Sculpture</a>
            <a href="#projects" onclick="closeMenu()">Projects</a>
            <a href="biography.html">BIOGRAPHY</a>
            <a href="#contact" onclick="closeMenu()">Contact</a>
        </div>
        <div class="menu-toggle" id="menuToggle" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <main>
        <section class="hero" id="hero-section">
            <div id="hero-img-wrap">
                <img src="images/cover.webp" alt="Zhang Jiarui Artwork" onerror="this.src='images/Cover.JPG';">
            </div>
            <div class="hero-overlay">
                <h1 class="hero-title">Matter <br> dissolves, <br> memory <br> crystallizes</h1>
            </div>
            <a href="#eco-art" class="scroll-indicator">
                <div class="scroll-arrow"></div>
            </a>
        </section>

        <section class="content-section" id="eco-art">
             <h2 class="category-title">Ecological Art</h2>
             </section>
        
        </main>

    <script>
        window.onscroll = function() {
            const nav = document.getElementById('navbar');
            const progress = document.getElementById('scroll-progress');
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            progress.style.width = (winScroll / height) * 100 + "%";
            if (winScroll > 50) nav.classList.add("nav-scrolled");
            else nav.classList.remove("nav-scrolled");
        };

        // 优化后的视差，降低移动幅度防止露白边
        if (window.innerWidth > 900) {
            const hero = document.getElementById('hero-section');
            const imgWrap = document.getElementById('hero-img-wrap');
            hero.addEventListener('mousemove', (e) => {
                const x = (e.clientX - window.innerWidth / 2) / 100;
                const y = (e.clientY - window.innerHeight / 2) / 100;
                imgWrap.style.transform = `scale(1.04) translate(${-x}px, ${-y}px)`;
            });
        }

        const navLinks = document.getElementById('navLinks');
        function toggleMenu() {
            navLinks.classList.toggle('active');
            document.body.style.overflow = navLinks.classList.contains('active') ? 'hidden' : 'auto';
        }
        function closeMenu() {
            navLinks.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>

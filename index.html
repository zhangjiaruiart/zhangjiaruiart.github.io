<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZHANG JIARUI | ARTIST</title>

  <!-- 基础性能优化 -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <link rel="dns-prefetch" href="//cdn.zhangjiarui.art" />
  <link rel="preconnect" href="https://cdn.zhangjiarui.art" crossorigin />

  <!-- 预加载首屏移动端封面 -->
  <link rel="preload" as="image" href="https://cdn.zhangjiarui.art/images/cover_mobile.webp" media="(max-width: 900px)" />

  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: Optima, Didot, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #fff;
      color: #111;
      overflow-x: hidden;
    }

    /* ========== NAV ========== */
    nav {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 28px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2000;
      transition: 0.4s ease;
    }

    nav.scrolled {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      padding: 14px 5%;
    }

    .logo {
      font-size: 14px;
      letter-spacing: 0.4em;
      text-decoration: none;
      color: #fff;
    }

    nav.scrolled .logo { color: #111; }

    /* ========== HERO ========== */
    .hero {
      height: 100vh;
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ========== CONTENT ========== */
    .section {
      padding: 80px 5% 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .title {
      font-size: 12px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      border-bottom: 1px solid #eee;
      padding-bottom: 14px;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
    }

    .project img {
      width: 100%;
      height: auto;
      display: block;
      background: #f5f5f5;
    }

    .project-title {
      font-size: 14px;
      margin-top: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .project-meta {
      font-size: 10px;
      color: #999;
      margin-top: 4px;
    }

    /* ========== MOBILE ========== */
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .section {
        padding: 50px 0 20px;
      }
      .project {
        padding: 0 5%;
      }
    }

    footer {
      padding: 50px 5%;
      text-align: center;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: #ccc;
      border-top: 1px solid #f2f2f2;
    }
  </style>
</head>

<body>

<nav id="nav">
  <a class="logo" href="#">ZHANGJIARUI ARTWORKS</a>
</nav>

<section class="hero">
  <picture>
    <source srcset="https://cdn.zhangjiarui.art/images/cover_mobile.webp" media="(max-width: 900px)">
    <img src="https://cdn.zhangjiarui.art/images/cover_desktop.webp" alt="Zhang Jiarui Art" fetchpriority="high" />
  </picture>
</section>

<section class="section">
  <h2 class="title">Ecological Art</h2>
  <div class="grid">

    <div class="project">
      <img src="https://cdn.zhangjiarui.art/images/ice_burial.webp" loading="lazy" width="1600" height="900" />
      <div class="project-title">Ice Burial</div>
      <div class="project-meta">Performance Art / 2025 / South China Sea</div>
    </div>

    <div class="project">
      <img src="https://cdn.zhangjiarui.art/images/4_5_tons.webp" loading="lazy" width="1600" height="900" />
      <div class="project-title">4.5 Tons</div>
      <div class="project-meta">Installation / 2024 / Inner Mongolia</div>
    </div>

  </div>
</section>

<footer>© 2026 ZHANGJIARUI ARTWORKS</footer>

<script>
  const nav = document.getElementById('nav');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 60) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHANG JIARUI | ARTIST</title>
    <style>
        /* 延续极简画廊风格 */
        body, html { margin: 0; padding: 0; font-family: "Optima", "Didot", "Helvetica Neue", Helvetica, Arial, sans-serif; background-color: #fff; color: #111; scroll-behavior: smooth; }
        nav { position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 50px 5%; box-sizing: border-box; z-index: 100; }
        .logo { font-size: 20px; font-weight: 300; letter-spacing: 0.6em; text-decoration: none; color: #fff; text-transform: uppercase; }
        .nav-links a { margin-left: 40px; text-decoration: none; color: #fff; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; font-weight: 300; }
        .hero { height: 100vh; width: 100%; overflow: hidden; position: relative; background-color: #1a1a1a; }
        .hero img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.85); display: block; }
        .content-section { padding: 140px 5%; max-width: 1400px; margin: 0 auto; }
        .section-title { font-size: 12px; letter-spacing: 0.6em; text-transform: uppercase; margin-bottom: 100px; text-align: center; color: #999; font-weight: 300; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 120px 60px; }
        .project { text-decoration: none; color: inherit; display: block; }
        .project-image-wrapper { overflow: hidden; margin-bottom: 30px; background-color: #f7f7f7; aspect-ratio: 4 / 5; }
        .project img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1.5s cubic-bezier(0.15, 1, 0.3, 1); }
        .project:hover img { transform: scale(1.05); }
        .project-title { font-size: 16px; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; }
        footer { padding: 120px 5% 60px; text-align: center; font-size: 9px; letter-spacing: 0.4em; color: #bbb; text-transform: uppercase; border-top: 1px solid #f2f2f2; margin-top: 100px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .hero { height: 75vh; } .nav-links { display: none; } }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ZHANG JIARUI</a>
        <div class="nav-links">
            <a href="#works">Works</a>
            <a href="about.html">About</a>
            <a href="mailto:contact@zhangjiarui.art">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <img src="Cover.jpg" alt="Zhang Jiarui Art" onerror="this.src='cover.jpg'">
    </section>

    <div class="content-section" id="works">
        <h2 class="section-title">Public Art & Installation</h2>
        <div class="grid">
            <div class="project">
                <div class="project-image-wrapper">
                    <img src="Work1.jpg" alt="Artwork One" onerror="this.src='work1.jpg'">
                </div>
                <div class="project-title">Selected Project One</div>
            </div>

            <div class="project">
                <div class="project-image-wrapper">
                    <img src="Work2.jpg" alt="Artwork Two" onerror="this.src='work2.jpg'">
                </div>
                <div class="project-title">Selected Project Two</div>
            </div>
        </div>
    </div>

    <footer>&copy; 2026 ZHANG JIARUI ART STUDIO.</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZHANG JIARUI | ARTIST - Ecological Art, Sculpture, and Projects</title>
    <meta name="description" content="Zhang Jiarui Artworks - A portfolio of Ecological Art, Sculpture, and Projects examining material, time, and systems.">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="images/favicon.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <link rel="preload" as="video" href="images/hero-bg.mp4" fetchpriority="high">
    <link rel="preconnect" href="" crossorigin>

    <style>
        /* 基础变量与全局样式 - 统一管理可复用值 */
        :root {
            --primary-font: "Optima", "Didot", "Helvetica Neue", Helvetica, Arial, sans-serif;
            --main-color: #111111;
            --transition-smooth: all 1.2s cubic-bezier(0.15, 1, 0.3, 1);
            --white-alpha-70: rgba(255, 255, 255, 0.7);
            --white-alpha-80: rgba(255, 255, 255, 0.8);
            --black-alpha-80: rgba(17, 17, 17, 0.8);
        }

        /* 重置样式 - 精简统一 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border: none;
            outline: none;
        }

        body, html {
            font-family: var(--primary-font);
            background-color: #ffffff;
            color: var(--main-color);
            scroll-behavior: smooth;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 欢迎页核心样式 - 关键修改：默认隐藏，仅首次访问显示 */
        #splash-page {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #000 !important;
            display: none; /* 默认隐藏，避免闪现 */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s cubic-bezier(0.85, 0, 0.15, 1), opacity 0.5s ease;
            overflow: hidden;
            background-image: none !important;
        }

        /* 仅首次访问时显示欢迎页 */
        body.first-visit #splash-page {
            display: flex;
        }

        #splash-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
            z-index: 0;
            opacity: 1 !important;
            display: block !important;
            preload: auto !important;
            object-position: center center;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        /* 隐藏视频控件 - 精简选择器 */
        video::-webkit-media-controls,
        video::-moz-media-controls,
        video::-ms-media-controls { 
            display: none !important; 
        }

        .splash-content {
            text-align: center;
            color: #ffffff;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 800px;
            background: transparent !important;
            height: 100%;
            position: relative;
        }

        /* 标题样式 - 精简重复属性 */
        .splash-title {
            font-size: clamp(20px, 8vw, 70px);
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin: 0;
            opacity: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            animation: fadeInUpSmooth 1.2s ease-in-out forwards 0.2s;
            white-space: nowrap;
            width: 100%;
            text-align: center !important;
            color: var(--white-alpha-80) !important;
            z-index: 1;
        }

        /* 箭头按钮 - 精简重复属性 */
        .enter-arrow-btn {
            background: none;
            cursor: pointer;
            padding: 25px;
            opacity: 0;
            animation: fadeIn 1s forwards 1.2s;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            position: absolute;
            top: 85%; /* 修改：从70%改为85%，向下移动50%距离 */
            left: 50%;
            transform: translate(-50%, 0) scale(0.9);
            margin: 0;
        }

        .arrow-icon {
            position: relative;
            width: 50px;
            height: 2px;
            background-color: var(--white-alpha-70) !important;
        }

        .arrow-icon::after {
            content: '';
            position: absolute;
            right: 0;
            top: -5px;
            width: 10px;
            height: 10px;
            border-top: 2px solid var(--white-alpha-70) !important;
            border-right: 2px solid var(--white-alpha-70) !important;
            transform: rotate(45deg);
        }

        /* 动画统一管理 - 精简重复定义 */
        @keyframes fadeInUpSmooth {
            0% {
                opacity: 0;
                transform: translate(-50%, -55%);
            }
            100% {
                opacity: 0.8;
                transform: translate(-50%, -60%);
                text-align: center !important;
            }
        }

        @keyframes fadeIn {
            to { 
                opacity: 0.7; 
                transform: translate(-50%, 0) scale(0.9); 
            }
        }

        @keyframes kenBurns {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        @keyframes kenBurnsMobile {
            0% { transform: scale(1.02); }
            100% { transform: scale(1.1); }
        }

        @keyframes arrowBounce {
            0%, 20%, 50%, 80%, 100% { 
                transform: translateY(0) rotate(45deg); 
                opacity: 0.3; 
            }
            40% { 
                transform: translateY(-10px) rotate(45deg); 
                opacity: 0.8; 
            }
        }

        @keyframes skeleton-loading {
            0% { left: -150%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        /* 通用状态类 - 精简重复定义 */
        body.splash-hidden #splash-page {
            transform: translateY(-100%);
            pointer-events: none;
            opacity: 0; /* 新增：直接透明，避免过渡闪烁 */
        }
        
        body.no-scroll { overflow: hidden; }

        /* 导航栏样式 - 精简冗余属性 */
        #scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--main-color);
            z-index: 3000;
            transition: width 0.1s ease-out;
        }

        nav {
            position: fixed;
            inset: 0 0 auto 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 5%;
            z-index: 2000;
            transition: all 0.6s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .nav-scrolled {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 15px 5%;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 0.5em;
            text-decoration: none;
            color: #ffffff;
            text-transform: uppercase;
            transition: color 0.4s ease;
            position: relative;
            z-index: 2001;
        }

        .nav-scrolled .logo { color: var(--main-color); }

        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-links a {
            margin-left: 35px;
            text-decoration: none;
            color: #ffffff;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 300;
            position: relative;
            padding-bottom: 5px;
            transition: color 0.4s ease, transform 0.3s ease;
            display: inline-block;
        }

        .nav-scrolled .nav-links a { color: var(--main-color); }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 1px;
            background: currentColor;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform: translateX(-50%);
        }

        .nav-links a:hover::after { width: 100%; }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            z-index: 2001;
        }

        .menu-toggle span {
            width: 25px;
            height: 1px;
            background-color: #ffffff;
            transition: all 0.3s ease;
        }

        .nav-scrolled .menu-toggle span { background-color: #111; }

        .menu-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
        .menu-toggle.active span:nth-child(2) { opacity: 0; }
        .menu-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }

        /* 英雄区样式 - 精简冗余属性 */
        .hero {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            position: relative;
            background-color: #000;
        }

        #hero-img-wrap {
            width: 105%;
            height: 105%;
            position: absolute;
            top: -2.5%;
            left: -2.5%;
            transition: transform 0.2s ease-out;
            will-change: transform;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 60%;
            filter: brightness(0.75);
            display: block;
            animation: kenBurns 20s ease-in-out infinite alternate;
        }

        .hero-overlay {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            z-index: 5;
            pointer-events: none;
        }

        .hero-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin: 0;
            line-height: 1.6;
            opacity: 0;
            filter: blur(10px);
            transform: translateY(30px);
            transition: opacity 2s ease, filter 2s ease, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .page-loaded .hero-title {
            opacity: 0.8;
            filter: blur(0);
            transform: translateY(0);
        }

        .hero-title br { display: none; }

        .scroll-indicator {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .scroll-arrow {
            width: 16px;
            height: 16px;
            border-right: 1.5px solid #ffffff;
            border-bottom: 1.5px solid #ffffff;
            transform: rotate(45deg);
            animation: arrowBounce 2s infinite;
        }

        /* 内容区域通用样式 - 精简重复定义 */
        .statement-section {
            padding: calc(120px + 5vh) 5% calc(40px + 5vh);
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
            scroll-margin-top: 100px;
        }

        .statement-text {
            font-size: 20px;
            line-height: 1.8;
            font-weight: 300;
            color: #222;
            letter-spacing: 0.02em;
            font-style: italic;
            opacity: 0;
            transform: translateY(20px);
            transition: var(--transition-smooth);
        }

        .content-section {
            padding: 40px 5% 20px;
            max-width: 1260px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(20px);
            transition: var(--transition-smooth);
            scroll-margin-top: 80px;
        }

        .revealed .statement-text,
        .content-section.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        .category-title {
            font-size: 13px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-bottom: 40px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 15px;
            color: var(--main-color);
        }

        /* 网格布局 - 精简重复定义 */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 60px;
            margin-bottom: 60px;
        }

        .grid-sculpture-custom {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px 30px;
            margin-bottom: 60px;
            width: 100%;
        }

        .series-label {
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .project {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .project-image-wrapper {
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
            background-color: transparent !important;
        }

        .project-image-wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: skeleton-loading 1.5s infinite;
            z-index: 1;
        }

        .project-image-wrapper.finished-loading::before {
            display: none;
        }

        .img-ratio {
            aspect-ratio: 4 / 5;
            display: block;
        }

        .video-ratio {
            aspect-ratio: 16 / 9;
            background-color: #000;
        }

        .project img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.8s cubic-bezier(0.15, 1, 0.3, 1), opacity 1s ease;
            opacity: 0;
        }

        .project img.loaded {
            opacity: 1 !important;
        }

        .project:hover img {
            transform: scale(1.05);
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.1);
            transition: background 0.3s;
            z-index: 2;
            opacity: 0;
        }

        .project img.loaded + .play-overlay {
            opacity: 1;
        }

        .play-button {
            width: 50px;
            height: 50px;
            border: 1px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 12px solid #fff;
            margin-left: 4px;
        }

        .project-title {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .project-meta {
            font-size: 10px;
            color: #aaa;
            margin-top: 4px;
            letter-spacing: 0.05

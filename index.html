<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHANG JIARUI | ARTIST</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: "Optima", "Didot", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #fff;
            color: #111;
            scroll-behavior: smooth;
        }

        nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 5%;
            box-sizing: border-box;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-decoration: none;
            color: #fff; 
            text-transform: uppercase;
        }

        .nav-links a {
            margin-left: 35px;
            text-decoration: none;
            color: #fff;
            font-size: 12px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 300;
        }

        .hero {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85);
        }

        .content-section {
            padding: 120px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 14px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-bottom: 80px;
            text-align: center;
            font-weight: 300;
            color: #888;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 100px 60px;
        }

        .project {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .project-image-wrapper {
            overflow: hidden;
            margin-bottom: 25px;
            background-color: #f9f9f9;
        }

        .project img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.8s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .project:hover img {
            transform: scale(1.03);
        }

        .project-title {
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .project-meta {
            font-size: 11px;
            color: #999;
            margin-top: 8px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        footer {
            padding: 100px 5% 60px;
            text-align: center;
            font-size: 10px;
            letter-spacing: 0.3em;
            color: #aaa;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .hero { height: 80vh; }
            .logo { font-size: 16px; letter-spacing: 0.2em; }
            .nav-links a { margin-left: 15px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ZHANG JIARUI</a>
        <div class="nav-links">
            <a href="#works">Works</a>
            <a href="about.html">About</a>
            <a href="mailto:your-email@example.com">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <img src="1.jpg" alt="Featured Work">
    </section>

    <div class="content-section" id="works">
        <h2 class="section-title">Selected Projects</h2>
        
        <div class="grid">
            <div class="project">
                <div class="project-image-wrapper">
                    <img src="2.jpg" alt="Artwork 01">
                </div>
                <div class="project-info">
                    <div class="project-title">Project Title One</div>
                    <div class="project-meta">Material, 2025</div>
                </div>
            </div>

            <div class="project">
                <div class="project-image-wrapper">
                    <img src="3.jpg" alt="Artwork 02">
                </div>
                <div class="project-info">
                    <div class="project-title">Project Title Two</div>
                    <div class="project-meta">Material, 2024</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 ZHANG JIARUI ART STUDIO.
    </footer>

</body>
</html>

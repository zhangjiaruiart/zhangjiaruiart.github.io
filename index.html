<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHANG JIARUI | ARTIST</title>
    <style>
        /* 核心美学：极简主义、大留白、超细字体 */
        body, html {
            margin: 0;
            padding: 0;
            font-family: "Optima", "Didot", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            scroll-behavior: smooth;
        }

        /* 顶部导航：在大图上方，保持通透感 */
        nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 50px 5%;
            box-sizing: border-box;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-decoration: none;
            color: #ffffff; 
            text-transform: uppercase;
        }

        .nav-links a {
            margin-left: 40px;
            text-decoration: none;
            color: #ffffff;
            font-size: 11px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-weight: 300;
            transition: opacity 0.3s ease;
        }

        .nav-links a:hover {
            opacity: 0.6;
        }

        /* 首页 Hero 大图 */
        .hero {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            position: relative;
            background-color: #1a1a1a;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85); /* 稍微压暗，保证白色文字清晰 */
            display: block;
        }

        /* 作品网格部分 */
        .content-section {
            padding: 140px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 12px;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 100px;
            text-align: center;
            color: #999;
            font-weight: 300;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 120px 60px;
        }

        .project {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .project-image-wrapper {
            overflow: hidden;
            margin-bottom: 30px;
            background-color: #f7f7f7;
            aspect-ratio: 4 / 5; /* 统一作品展示比例 */
        }

        .project img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 1.5s cubic-bezier(0.15, 1, 0.3, 1);
        }

        .project:hover img {
            transform: scale(1.05);
        }

        .project-title {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .project-meta {
            font-size: 10px;
            color: #999;
            margin-top: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* 页脚 */
        footer {
            padding: 120px 5% 60px;
            text-align: center;
            font-size: 9px;
            letter-spacing: 0.4em;
            color: #bbb;
            text-transform: uppercase;
            border-top: 1px solid #f2f2f2;
            margin-top: 100px;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; gap: 80px; }
            .hero { height: 75vh; }
            .logo { font-size: 16px; letter-spacing: 0.4em; }
            .nav-links { display: none; } /* 移动端保持极其简洁 */
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ZHANG JIARUI</a>
        <div class="nav-links">
            <a href="#works">Works</a>
            <a href="about.html">About</a>
            <a href="mailto:contact@zhangjiarui.art">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <img src="cover.jpg" alt="Zhang Jiarui Art">
    </section>

    <div class="content-section" id="works">
        <h2 class="section-title">Public Art & Installation</h2>
        
        <div class="grid">
            <div class="project">
                <div class="project-image-wrapper">
                    <img src="work1.jpg" alt="Artwork One">
                </div>
                <div class="project-info">
                    <div class="project-title">Selected Project One</div>
                    <div class="project-meta">Location / Material — 2026</div>
                </div>
            </div>

            <div class="project">
                <div class="project-image-wrapper">
                    <img src="work2.jpg" alt="Artwork Two">
                </div>
                <div class="project-info">
                    <div class="project-title">Selected Project Two</div>
                    <div class="project-meta">Location / Material — 2025</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 ZHANG JIARUI ART STUDIO. ALL RIGHTS RESERVED.
    </footer>

</body>
</html>

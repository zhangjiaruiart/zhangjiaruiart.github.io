<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHANG JIARUI | ARTIST</title>
    <style>
        /* 全局美学设置：参考 Janet Echelman 的极简呼吸感 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        /* 导航栏：极简、间距拉大 */
        nav {
            padding: 60px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 10px;
            text-decoration: none;
            color: #000;
            text-transform: uppercase;
        }

        .nav-links a {
            margin-left: 40px;
            text-decoration: none;
            color: #666;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #000;
        }

        /* 首页核心大图：沉浸式 */
        .hero {
            padding: 0 5%;
            margin-bottom: 150px;
        }

        .hero img {
            width: 100%;
            height: 85vh;
            object-fit: cover; /* 保证图片不变形 */
            filter: grayscale(20%); /* 略微去色增加高级感 */
        }

        /* 作品网格：模仿画廊布局 */
        .container {
            width: 90%;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 两列布局 */
            gap: 120px 80px; /* 超大间距 */
            margin-bottom: 150px;
        }

        .project {
            text-decoration: none;
            color: inherit;
        }

        .project img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 25px;
            transition: opacity 0.5s;
        }

        .project img:hover {
            opacity: 0.8;
        }

        .project-title {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .project-category {
            font-size: 12px;
            color: #999;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* 页脚 */
        footer {
            padding: 100px 5%;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 11px;
            letter-spacing: 2px;
            color: #bbb;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .logo { font-size: 18px; letter-spacing: 5px; }
            nav { flex-direction: column; gap: 30px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo">ZHANG JIARUI</a>
        <div class="nav-links">
            <a href="#">Works</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <div class="hero">
        <img src="images/cover.jpg" alt="Featured Work">
    </div>

    <div class="container">
        <div class="grid">
            <div class="project">
                <img src="images/work1.jpg" alt="Work 01">
                <div class="project-title">Project Title One</div>
                <div class="project-category">Sculpture / Installation</div>
            </div>

            <div class="project">
                <img src="images/work2.jpg" alt="Work 02">
                <div class="project-title">Project Title Two</div>
                <div class="project-category">Mixed Media</div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 ZHANG JIARUI. ALL RIGHTS RESERVED.
    </footer>

</body>
</html>

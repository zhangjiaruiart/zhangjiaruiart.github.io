<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHANG JIARUI | ARTIST</title>
    <style>
        body, html { margin: 0; padding: 0; font-family: "Optima", sans-serif; background-color: #fff; color: #111; scroll-behavior: smooth; }
        nav { position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 50px 5%; box-sizing: border-box; z-index: 100; }
        .logo { font-size: 20px; letter-spacing: 0.6em; text-decoration: none; color: #fff; text-transform: uppercase; }
        .hero { height: 100vh; width: 100%; background-color: #1a1a1a; }
        .hero img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8); display: block; }
        .content-section { padding: 80px 5%; max-width: 1400px; margin: 0 auto; }
        .category-title { font-size: 14px; letter-spacing: 0.5em; text-transform: uppercase; border-bottom: 1px solid #eee; padding-bottom: 15px; margin: 60px 0; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 60px; }
        .project-image-wrapper { background-color: #f7f7f7; aspect-ratio: 4/5; overflow: hidden; }
        .project img { width: 100%; height: 100%; object-fit: cover; display: block; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } .hero { height: 70vh; } }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">ZHANG JIARUI</a>
    </nav>

    <section class="hero">
        <img src="Cover.jpg" alt="Cover" onerror="this.src='cover.jpg'">
    </section>

    <div class="content-section" id="eco-art">
        <h2 class="category-title">Ecological Art</h2>
        <div class="grid">
            <div class="project">
                <div class="project-image-wrapper">
                    <img src="Work1.jpg" alt="Work 1" onerror="this.src='work1.jpg'">
                </div>
            </div>
            <div class="project">
                <div class="project-image-wrapper">
                    <img src="Work2.jpg" alt="Work 2" onerror="this.src='work2.jpg'">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
